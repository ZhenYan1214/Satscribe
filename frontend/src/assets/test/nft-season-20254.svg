<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#74B9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00CEC9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDCB6E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E17055;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="400" fill="url(#grad1)" rx="20"/>
  
  <!-- 主要圖形 -->
  <circle cx="200" cy="150" r="80" fill="url(#grad2)" opacity="0.9"/>
  
  <!-- 裝飾線條 -->
  <path d="M50 280 Q200 250 350 280" stroke="white" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M70 300 Q200 270 330 300" stroke="white" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- VIP標誌 -->
  <rect x="150" y="250" width="100" height="40" fill="white" rx="20" opacity="0.9"/>
  <text x="200" y="275" text-anchor="middle" fill="#6C5CE7" font-family="Arial, sans-serif" font-size="16" font-weight="bold">VIP</text>
  
  <!-- 季度標識 -->
  <rect x="30" y="30" width="80" height="30" fill="rgba(255,255,255,0.9)" rx="15"/>
  <text x="70" y="50" text-anchor="middle" fill="#6C5CE7" font-family="Arial, sans-serif" font-size="14" font-weight="bold">2025 Q4</text>
  
  <!-- 創作者標識 -->
  <text x="200" y="330" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">zhenyan</text>
  <text x="200" y="350" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="12">創作者會員章</text>
</svg>