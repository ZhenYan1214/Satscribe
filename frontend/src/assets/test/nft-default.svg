<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="defaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A29BFE;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6C5CE7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5F3DC4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="400" fill="url(#defaultGrad)" rx="20"/>
  
  <!-- 鑽石形狀 -->
  <polygon points="200,80 280,160 200,240 120,160" fill="white" opacity="0.9"/>
  <polygon points="200,100 260,160 200,220 140,160" fill="#6C5CE7" opacity="0.8"/>
  
  <!-- 裝飾元素 -->
  <circle cx="100" cy="100" r="20" fill="white" opacity="0.3"/>
  <circle cx="300" cy="120" r="15" fill="white" opacity="0.4"/>
  <circle cx="80" cy="300" r="25" fill="white" opacity="0.2"/>
  <circle cx="320" cy="280" r="18" fill="white" opacity="0.3"/>
  
  <!-- VIP標誌 -->
  <rect x="150" y="280" width="100" height="40" fill="white" rx="20" opacity="0.9"/>
  <text x="200" y="305" text-anchor="middle" fill="#6C5CE7" font-family="Arial, sans-serif" font-size="16" font-weight="bold">NFT</text>
  
  <!-- 標題 -->
  <text x="200" y="350" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">會員專屬NFT</text>
</svg>