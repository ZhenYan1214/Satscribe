<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT 購買問題診斷工具</title>
    <script src="https://unpkg.com/@stacks/connect@8"></script>
    <script src="https://unpkg.com/@stacks/transactions@6"></script>
    <script src="https://unpkg.com/@stacks/network@6"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: #0f0f23;
            color: #ffffff;
        }
        .container {
            background: #1a1a3a;
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            border: 1px solid #333;
        }
        .success { background: #0f5132; border-color: #146c43; }
        .error { background: #842029; border-color: #b02a37; }
        .warning { background: #664d03; border-color: #b08d0b; }
        .info { background: #055160; border-color: #0a6c7b; }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #555;
            border-radius: 5px;
            background: #2a2a4a;
            color: white;
            font-size: 14px;
        }
        
        .step {
            margin: 15px 0;
            padding: 15px;
            border-left: 4px solid #667eea;
            background: #252545;
        }
        
        .log {
            background: #1e1e1e;
            border: 1px solid #444;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
    </style>
</head>
<body>
    <h1>🔍 NFT 購買問題診斷工具</h1>
    <p>這個工具會幫您診斷為什麼無法購買 20254 的 NFT</p>

    <div class="container">
        <h2>📝 步驟 1: 連接錢包</h2>
        <button id="connectWallet">連接錢包</button>
        <div id="walletStatus">❌ 未連接</div>
    </div>

    <div class="container">
        <h2>🔍 步驟 2: 輸入診斷信息</h2>
        <div class="grid">
            <div>
                <label>創作者錢包地址 (zhenyan):</label>
                <input type="text" id="creatorAddress" placeholder="ST...">
                <small>這是創建 NFT 的錢包地址</small>
            </div>
            <div>
                <label>季度 ID:</label>
                <input type="number" id="seasonId" value="20254">
                <small>要購買的季度 ID</small>
            </div>
        </div>
        <button id="startDiagnosis">🔍 開始診斷</button>
    </div>

    <div class="container">
        <h2>📊 診斷結果</h2>
        <div id="diagnosisResults">等待診斷...</div>
    </div>

    <div class="container">
        <h2>🛠️ 修復建議</h2>
        <div id="fixSuggestions">等待診斷結果...</div>
    </div>

    <div class="container">
        <h2>📋 診斷日誌</h2>
        <div id="logContainer" class="log">等待開始診斷...</div>
    </div>

    <script>
        const CONTRACT_ADDRESS = 'ST2FGWKW4M6KBY2P19WZRDH9TCDMGMTDGA2D301HQ';
        
        let walletConnected = false;
        let userAddress = '';
        
        // 日誌功能
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logContainer = document.getElementById('logContainer');
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️';
            logContainer.textContent += `[${timestamp}] ${prefix} ${message}\n`;
            logContainer.scrollTop = logContainer.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        // 連接錢包
        document.getElementById('connectWallet').addEventListener('click', async () => {
            try {
                log('正在連接錢包...');
                
                // 使用 Stacks Connect v8+ API
                await window.StacksConnect.connect();
                
                // 檢查連接狀態
                if (window.StacksConnect.isConnected()) {
                    const userData = window.StacksConnect.getLocalStorage();
                    userAddress = userData.addresses.stx[0].address;
                    walletConnected = true;
                    
                    document.getElementById('walletStatus').innerHTML = `✅ 已連接: ${userAddress}`;
                    log(`錢包連接成功: ${userAddress}`, 'success');
                } else {
                    throw new Error('連接失敗');
                }
            } catch (error) {
                log(`錢包連接失敗: ${error.message}`, 'error');
                document.getElementById('walletStatus').innerHTML = `❌ 連接失敗: ${error.message}`;
            }
        });

        // 開始診斷
        document.getElementById('startDiagnosis').addEventListener('click', async () => {
            if (!walletConnected) {
                alert('請先連接錢包');
                return;
            }

            const creatorAddress = document.getElementById('creatorAddress').value.trim();
            const seasonId = parseInt(document.getElementById('seasonId').value);

            if (!creatorAddress) {
                alert('請輸入創作者地址');
                return;
            }

            log('開始診斷 NFT 購買問題...', 'info');
            log(`創作者地址: ${creatorAddress}`);
            log(`季度 ID: ${seasonId}`);
            log(`購買者地址: ${userAddress}`);

            const results = [];
            const fixes = [];

            try {
                // 診斷 1: 檢查季度是否存在
                log('🔍 檢查季度是否存在...');
                const seasonInfo = await checkSeasonExists(creatorAddress, seasonId);
                
                if (seasonInfo) {
                    log('✅ 季度存在!', 'success');
                    results.push(`✅ 季度 ${seasonId} 存在`);
                    results.push(`- 價格: ${seasonInfo.price} microSTX (${(seasonInfo.price / 1000000).toFixed(2)} STX)`);
                    results.push(`- 活躍狀態: ${seasonInfo.active}`);
                    results.push(`- 當前供應量: ${seasonInfo.current_supply || seasonInfo['current-supply']}`);
                    results.push(`- 分潤啟用: ${seasonInfo.revenue_split_enabled || seasonInfo['revenue-split-enabled']}`);
                } else {
                    log('❌ 季度不存在!', 'error');
                    results.push(`❌ 季度 ${seasonId} 不存在`);
                    fixes.push('🛠️ 修復建議: 創作者需要先創建季度 NFT');
                    fixes.push('- 在創作者面板中創建季度 NFT');
                    fixes.push('- 確保使用正確的季度 ID (20254)');
                }

                // 診斷 2: 檢查創作者是否註冊
                log('🔍 檢查創作者註冊狀態...');
                const creatorInfo = await checkCreatorRegistered(creatorAddress);
                
                if (creatorInfo) {
                    log('✅ 創作者已註冊', 'success');
                    results.push(`✅ 創作者已註冊: ${creatorInfo.name}`);
                } else {
                    log('❌ 創作者未註冊', 'error');
                    results.push('❌ 創作者未註冊');
                    fixes.push('🛠️ 修復建議: 創作者需要先註冊');
                }

                // 診斷 3: 檢查用戶餘額
                log('🔍 檢查用戶 STX 餘額...');
                const balance = await getUserBalance();
                const requiredSTX = seasonInfo ? seasonInfo.price / 1000000 : 10;
                
                results.push(`💰 用戶餘額: ${balance} STX`);
                results.push(`💰 需要金額: ${requiredSTX} STX`);
                
                if (balance >= requiredSTX) {
                    log('✅ 餘額充足', 'success');
                    results.push('✅ 餘額充足');
                } else {
                    log('❌ 餘額不足', 'error');
                    results.push('❌ 餘額不足');
                    fixes.push(`🛠️ 修復建議: 需要至少 ${requiredSTX} STX`);
                }

                // 診斷 4: 檢查是否為創作者本人
                if (userAddress === creatorAddress) {
                    log('⚠️ 警告: 創作者不能購買自己的 NFT', 'warning');
                    results.push('⚠️ 警告: 創作者不能購買自己的 NFT');
                    fixes.push('🛠️ 修復建議: 請切換到不同的錢包地址進行測試');
                }

                // 診斷 5: 嘗試調用購買函數 (乾跑)
                if (seasonInfo && seasonInfo.active) {
                    log('🔍 模擬購買調用...');
                    try {
                        await simulatePurchase(creatorAddress, seasonId);
                        log('✅ 購買調用模擬成功', 'success');
                        results.push('✅ 購買參數正確');
                    } catch (error) {
                        log(`❌ 購買模擬失敗: ${error.message}`, 'error');
                        results.push(`❌ 購買模擬失敗: ${error.message}`);
                        fixes.push(`🛠️ 修復建議: ${error.message}`);
                    }
                }

            } catch (error) {
                log(`診斷過程中發生錯誤: ${error.message}`, 'error');
                results.push(`❌ 診斷錯誤: ${error.message}`);
            }

            // 顯示結果
            document.getElementById('diagnosisResults').innerHTML = results.join('<br>');
            document.getElementById('fixSuggestions').innerHTML = fixes.length > 0 ? fixes.join('<br>') : '✅ 無需修復';

            log('診斷完成!', 'success');
        });

        // 檢查季度是否存在
        async function checkSeasonExists(creatorAddress, seasonId) {
            try {
                const result = await window.StacksTransactions.callReadOnlyFunction({
                    contractAddress: CONTRACT_ADDRESS,
                    contractName: 'subscription-nft-v6',
                    functionName: 'get-season-info',
                    functionArgs: [
                        window.StacksTransactions.standardPrincipalCV(creatorAddress),
                        window.StacksTransactions.uintCV(seasonId)
                    ],
                    network: new window.StacksNetwork.StacksTestnet(),
                    senderAddress: userAddress
                });

                log(`季度查詢結果: ${JSON.stringify(result)}`);
                
                if (result.type === 'some' && result.value) {
                    return parseClarityValue(result.value);
                }
                return null;
            } catch (error) {
                log(`檢查季度存在性失敗: ${error.message}`, 'error');
                return null;
            }
        }

        // 檢查創作者註冊狀態
        async function checkCreatorRegistered(creatorAddress) {
            try {
                const result = await window.StacksTransactions.callReadOnlyFunction({
                    contractAddress: CONTRACT_ADDRESS,
                    contractName: 'creator-registry-v6',
                    functionName: 'get-creator-info',
                    functionArgs: [
                        window.StacksTransactions.standardPrincipalCV(creatorAddress)
                    ],
                    network: new window.StacksNetwork.StacksTestnet(),
                    senderAddress: userAddress
                });

                if (result.type === 'some' && result.value) {
                    return parseClarityValue(result.value);
                }
                return null;
            } catch (error) {
                log(`檢查創作者註冊狀態失敗: ${error.message}`, 'error');
                return null;
            }
        }

        // 獲取用戶 STX 餘額
        async function getUserBalance() {
            try {
                const response = await fetch(`https://api.testnet.hiro.so/extended/v1/address/${userAddress}/stx`);
                const data = await response.json();
                return parseInt(data.balance) / 1000000; // 轉換為 STX
            } catch (error) {
                log(`獲取餘額失敗: ${error.message}`, 'error');
                return 0;
            }
        }

        // 模擬購買調用
        async function simulatePurchase(creatorAddress, seasonId) {
            // 這裡只是檢查參數，不實際執行
            const args = [
                window.StacksTransactions.standardPrincipalCV(creatorAddress),
                window.StacksTransactions.uintCV(seasonId),
                window.StacksTransactions.stringAsciiCV('test-metadata')
            ];
            
            log('購買參數驗證通過');
            return true;
        }

        // 解析 Clarity 值
        function parseClarityValue(value) {
            if (!value) return null;

            switch (value.type) {
                case 12: // tuple
                    const result = {};
                    if (value.data) {
                        for (const [key, val] of Object.entries(value.data)) {
                            result[key] = parseClarityValue(val);
                        }
                    }
                    return result;
                    
                case 1: // uint
                case 2: // uint
                    return typeof value.value === 'bigint' ? Number(value.value) : parseInt(value.value);
                    
                case 3: // bool false
                    return false;
                    
                case 4: // bool true  
                    return true;
                    
                case 13: // string-ascii
                case 14: // string-ascii
                case 15: // string-utf8
                    return value.data;
                    
                default:
                    return value;
            }
        }

        log('NFT 診斷工具已載入，請連接錢包開始診斷');
    </script>
</body>
</html>
